name: NearCut CI

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/salon-booking-pwa/**'
      - '.github/workflows/nearcut-ci.yml'
  push:
    branches: [main, master]
    paths:
      - 'apps/salon-booking-pwa/**'
      - '.github/workflows/nearcut-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/salon-booking-pwa

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/salon-booking-pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
